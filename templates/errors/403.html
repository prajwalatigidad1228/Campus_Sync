{% extends "base.html" %}
{% block title %}403 – Forbidden{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-lock">🔒</div>
  <h1>403</h1>
  <h2>Access Denied</h2>
  <p>You do not have permission to access this resource.<br>
     If you believe this is a mistake, please contact the administrator.</p>
  <div class="error-actions">
    <a href="{{ url_for('dashboard.index') }}" class="btn">Go to Dashboard</a>
    <a href="{{ url_for('auth.logout') }}" class="btn btn-outline">Sign out</a>
  </div>
</div>
{% endblock %}
